services:
  - type: web
    name: book-recommendation-game
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python build_model.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: GOOGLE_BOOKS_API_KEY
        sync: false
